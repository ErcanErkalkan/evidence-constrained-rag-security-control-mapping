name: AICCONF Phase2 DEV Pilot

on:
  push:
    branches:
      - aicconf-experiment-20260914
    paths:
      - .github/workflows/aicconf-phase2-dev-pilot.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify canonical Phase-2 v1.6 DEV code hashes
        working-directory: aicconf_runner/phase2
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/phase2_expected.sha256 <<'EOF'
          7f0e569d4a0bda86d660a9ed6cd1ca7e75c25e7ccb84fa4ab427f901ebb7029e  common.py
          591a5b1af756d33b0904c1fc12ffb8dc487af978b24ce4696a0eb86cf4a6a523  build_target_corpus.py
          9116f4df79a46424059dfc0e29fc3e4018bfa6fa5623eebc8401b078ece6cca7  run_retrieval.py
          e9100112365ea210aab55841ebf71eee8b20a7bde4b08c90085f4ea5065c6710  make_attack_fixtures.py
          8e987a8d148c9f9adec9cd76984b2ad34350ab691e26f273d78e4f6885682aff  compose_prompt_cases.py
          00a9f33d691e502c7e4d77fb8f82cfa74af3370ea46049567e26c04b22a7dd44  ollama_preflight.py
          ceacef9975d57e301535fc1f7d992133101e08f9e5b694eaad0e4e59ae603dc4  run_ollama.py
          367b1cb539cfb58c5bbdd3f676b8b838ffc56732058b2d795621d9c48d6a6055  apply_output_guard.py
          2070d73f14b3f3d605a5d26e006ce8c62512af1c265e2a537b14cc2477485ce4  evaluate_generation.py
          383c0555dffa7eaf7d5dd78a1e9d7eba6cbf3438ea9e23569bb93ed9f6eb4708  statistical_tests.py
          6d0883aee4fc9502b853cdcd84e9c8024064ed7b3c6283273257baa96ac43d64  prepare_phase2.py
          40aab662c7c5b913abb20b545e5caec5996ff0e7c7677ec9058c7833438aa900  requirements.txt
          119cb4772e2b2ce6377a6b4833d88b0d3306b92bb6eddd7cceb42d127d2ef365  schemas/model_output.schema.json
          EOF
          sha256sum -c /tmp/phase2_expected.sha256
          python -m py_compile common.py build_target_corpus.py run_retrieval.py make_attack_fixtures.py compose_prompt_cases.py ollama_preflight.py run_ollama.py apply_output_guard.py evaluate_generation.py statistical_tests.py prepare_phase2.py
      - name: Install analysis requirements
        working-directory: aicconf_runner/phase2
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Download frozen Phase-1 handoff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p1artifact /tmp/phase1_run
          gh run download 34834655690 --repo ErcanErkalkan/demo_ece --name AICCONF-PHASE1-FROZEN-HANDOFF --dir /tmp/p1artifact
          echo 'ce3686fc029787e66d3291f63d01fc536d17ad0936fa812ea5a81e1978247c06  /tmp/p1artifact/PHASE1_FROZEN_HANDOFF.zip' | sha256sum -c -
          unzip -q /tmp/p1artifact/PHASE1_FROZEN_HANDOFF.zip -d /tmp/phase1_run
          python - <<'PY'
          import json
          p='/tmp/phase1_run/benchmark_frozen/PHASE1_RELEASE_FREEZE.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['status']=='PASS_PHASE1_FROZEN'
          assert x['validation_report']['benchmark_rows']==195
          print('PHASE1 VERIFIED',x['status'])
          PY
      - name: Prepare DEV from frozen benchmark
        working-directory: aicconf_runner/phase2
        run: |
          python prepare_phase2.py --phase1-run /tmp/phase1_run --split dev --top-k 10 --context-k 5 --attack-rank 1 --outdir /tmp/phase2_dev
          python - <<'PY'
          import json
          p='/tmp/phase2_dev/PHASE2_DEV_PREP_MANIFEST.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['status']=='DEV_PREP_READY_NO_MODEL_RUN'
          print(json.dumps({m:json.load(open(x['methods'][m]['metrics'])) for m in ['bm25','tfidf']},indent=2))
          PY
      - name: Build balanced DEV pilot cases from BM25
        shell: bash
        run: |
          python - <<'PY'
          import json
          src='/tmp/phase2_dev/prompt_cases_dev_bm25.jsonl'
          rows=[json.loads(x) for x in open(src,encoding='utf-8') if x.strip()]
          qids=sorted({r['query_id'] for r in rows})
          benign=set(qids[:6]); attacked=set(qids[:4])
          out=[]
          for r in rows:
              if r['condition'] in {'C0_UNGROUNDED','C1_CLEAN_RAG'} and r['query_id'] in benign:
                  out.append(r)
              elif r['condition'] in {'C2_COMPROMISED_RAG','C3_HARDENED_RAG'} and r['query_id'] in attacked:
                  out.append(r)
          assert len(out)==52, len(out)
          with open('/tmp/phase2_dev/pilot_cases_bm25.jsonl','w',encoding='utf-8') as f:
              for r in out: f.write(json.dumps(r,ensure_ascii=False,sort_keys=True)+'\n')
          print('pilot_cases',len(out),'queries',len(set(r['query_id'] for r in out)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AICCONF-PHASE2-DEV-PREP-v16
          path: /tmp/phase2_dev
          retention-days: 30

  pilot-model:
    needs: prepare-dev
    strategy:
      fail-fast: false
      matrix:
        model:
          - qwen2.5:1.5b
          - llama3.2:1b
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: AICCONF-PHASE2-DEV-PREP-v16
          path: /tmp/phase2_dev
      - name: Install Python requirements
        working-directory: aicconf_runner/phase2
        run: python -m pip install -r requirements.txt
      - name: Install and start Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/version
      - name: Pull and freeze exact model identity
        working-directory: aicconf_runner/phase2
        shell: bash
        run: |
          set -euo pipefail
          ollama pull '${{ matrix.model }}'
          SAFE=$(echo '${{ matrix.model }}' | tr ':/' '__')
          python ollama_preflight.py --model '${{ matrix.model }}' --out "/tmp/phase2_dev/OLLAMA_MODEL_FREEZE_${SAFE}.json"
      - name: Run balanced DEV pilot inference
        working-directory: aicconf_runner/phase2
        shell: bash
        run: |
          set -euo pipefail
          SAFE=$(echo '${{ matrix.model }}' | tr ':/' '__')
          python run_ollama.py \
            --cases /tmp/phase2_dev/pilot_cases_bm25.jsonl \
            --model '${{ matrix.model }}' \
            --model-freeze "/tmp/phase2_dev/OLLAMA_MODEL_FREEZE_${SAFE}.json" \
            --temperature 0 --seed 2027 --num-ctx 8192 --num-predict 512 \
            --top-p 1.0 --top-k-sampling 40 --repeat-penalty 1.1 \
            --timeout 180 --retries 2 \
            --out "/tmp/phase2_dev/pilot_predictions_${SAFE}.jsonl"
          python apply_output_guard.py \
            --cases /tmp/phase2_dev/pilot_cases_bm25.jsonl \
            --predictions "/tmp/phase2_dev/pilot_predictions_${SAFE}.jsonl" \
            --out "/tmp/phase2_dev/pilot_predictions_${SAFE}_guarded.jsonl"
          python evaluate_generation.py \
            --cases /tmp/phase2_dev/pilot_cases_bm25.jsonl \
            --predictions "/tmp/phase2_dev/pilot_predictions_${SAFE}_guarded.jsonl" \
            --corpus /tmp/phase2_dev/corpus_primary/nist_corpus.csv \
            --outdir "/tmp/phase2_dev/pilot_eval_${SAFE}"
          python - <<PY
          import json,statistics
          safe='${{ matrix.model }}'.replace(':','__').replace('/','__')
          rows=[json.loads(x) for x in open(f'/tmp/phase2_dev/pilot_predictions_{safe}.jsonl',encoding='utf-8')]
          s=json.load(open(f'/tmp/phase2_dev/pilot_eval_{safe}/generation_summary.json',encoding='utf-8'))
          print('LATENCY mean',sum(r['latency_s'] for r in rows)/len(rows),'median',statistics.median(r['latency_s'] for r in rows),'n',len(rows))
          print(json.dumps(s,indent=2,allow_nan=True))
          PY
      - name: Upload model pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AICCONF-PHASE2-DEV-PILOT-${{ strategy.job-index }}
          path: |
            /tmp/phase2_dev/OLLAMA_MODEL_FREEZE_*.json
            /tmp/phase2_dev/pilot_predictions_*.jsonl
            /tmp/phase2_dev/pilot_predictions_*.manifest.json
            /tmp/phase2_dev/pilot_predictions_*_guarded.jsonl
            /tmp/phase2_dev/pilot_eval_*/
            /tmp/ollama.log
          if-no-files-found: warn
          retention-days: 30
