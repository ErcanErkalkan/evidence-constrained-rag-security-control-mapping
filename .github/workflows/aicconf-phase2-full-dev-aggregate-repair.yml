name: AICCONF Phase2 Full DEV Aggregate Repair

on:
  push:
    branches: [main]
    paths: [.github/workflows/aicconf-phase2-full-dev-aggregate-repair.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install evaluator requirements
        working-directory: aicconf_runner/phase2
        run: python -m pip install -r requirements.txt
      - name: Recover original full-DEV artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dev /tmp/shards
          gh run download 34848420216 --repo "$GITHUB_REPOSITORY" --name phase2-full-dev-prep --dir /tmp/dev
          for s in 0 1 2 3 4 5 6 7; do
            mkdir -p "/tmp/shards/$s"
            gh run download 34848420216 --repo "$GITHUB_REPOSITORY" --name "phase2-full-dev-shard-$s" --dir "/tmp/shards/$s"
          done
      - name: Independently verify and merge all 408 predictions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/final
          python - <<'PY'
          import json, pathlib, hashlib, statistics
          order=json.load(open('/tmp/dev/full_dev_order.json'))
          assert len(order)==408 and len(order)==len(set(order))
          prep=json.load(open('/tmp/dev/PHASE2_DEV_PREP_MANIFEST.json'))
          assert prep['status']=='DEV_PREP_READY_NO_MODEL_RUN'
          assert prep['benchmark_sha256']=='426d890e16513c3da449dfe08e93f29f556011e6a24288460c07ccba8f090f4f'
          assert prep['corpus_sha256']=='02b12c20fe14e6a46e11249579559b44e674580cbdcc7a7424dbdd704ebb11e3'
          preds={}; shard_hashes={}
          for s in range(8):
              d=pathlib.Path(f'/tmp/shards/{s}/shard')
              p=d/f'pred_{s}.jsonl'; m=d/f'pred_{s}.jsonl.manifest.json'; mf=d/f'model_{s}.json'
              assert p.exists() and m.exists() and mf.exists(), (s,list(d.glob('*')))
              man=json.load(open(m)); model=json.load(open(mf))
              assert man['status']=='PASS_COMPLETE' and man['case_count']==51 and not man['failures']
              assert man['model_digest']=='65ec06548149b04c096a120e4a6da9d4017ea809c91734ea5631e89f96ddc57b'
              assert hashlib.sha256(p.read_bytes()).hexdigest()==man['predictions_sha256']
              assert model['status']=='PASS_OLLAMA_MODEL_FROZEN'
              assert model['model_digest']=='65ec06548149b04c096a120e4a6da9d4017ea809c91734ea5631e89f96ddc57b'
              shard_hashes[str(s)]=man['predictions_sha256']
              rows=[json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
              assert len(rows)==51
              for r in rows:
                  cid=r['case_id']
                  assert cid not in preds, cid
                  assert r['model']=='qwen2.5:1.5b'
                  assert r['model_digest']=='65ec06548149b04c096a120e4a6da9d4017ea809c91734ea5631e89f96ddc57b'
                  assert r['error']==''
                  preds[cid]=r
          assert len(preds)==408, len(preds)
          assert set(order)==set(preds)
          out=pathlib.Path('/tmp/final/pred_qwen2.5_1.5b.jsonl')
          with out.open('w',encoding='utf-8') as f:
              for cid in order: f.write(json.dumps(preds[cid],ensure_ascii=False,sort_keys=True)+'\n')
          lats=[preds[cid]['latency_s'] for cid in order]
          manifest={
              'status':'PASS_FULL_DEV_MERGED_REPAIRED',
              'source_run_id':34848420216,
              'source_commit':'573818e9173fa9419658f2a73c07a991b8abdf30',
              'repair_reason':'original aggregate glob omitted shard/ subdirectory; inference artifacts were intact',
              'case_count':408,
              'model':'qwen2.5:1.5b',
              'model_digest':'65ec06548149b04c096a120e4a6da9d4017ea809c91734ea5631e89f96ddc57b',
              'predictions_sha256':hashlib.sha256(out.read_bytes()).hexdigest(),
              'shard_prediction_hashes':shard_hashes,
              'latency_mean_s':sum(lats)/len(lats),
              'latency_median_s':statistics.median(lats),
              'test_accessed':False
          }
          pathlib.Path('/tmp/final/FULL_DEV_MERGE_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps(manifest,indent=2))
          PY
      - name: Apply guard, evaluate full DEV, and run DEV-only statistics
        working-directory: aicconf_runner/phase2
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c statistical_tests_canonical.sha256
          python apply_output_guard.py --cases /tmp/dev/prompt_cases_dev_bm25.jsonl --predictions /tmp/final/pred_qwen2.5_1.5b.jsonl --out /tmp/final/pred_qwen2.5_1.5b_guarded.jsonl
          python evaluate_generation.py --cases /tmp/dev/prompt_cases_dev_bm25.jsonl --predictions /tmp/final/pred_qwen2.5_1.5b_guarded.jsonl --corpus /tmp/dev/corpus_primary/nist_corpus.csv --outdir /tmp/final/eval
          python statistical_tests.py --per-case /tmp/final/eval/generation_per_case.csv --outdir /tmp/final/stats --bootstrap-iters 10000 --seed 2027
          cp /tmp/dev/PHASE2_DEV_PREP_MANIFEST.json /tmp/final/
          cp /tmp/dev/retrieval_dev_bm25/bm25_metrics.json /tmp/final/
          cp /tmp/dev/full_dev_order.json /tmp/final/
          cp /tmp/shards/*/shard/model_*.json /tmp/final/
          python - <<'PY'
          import json,hashlib,pathlib
          s=json.load(open('/tmp/final/eval/generation_summary.json'))
          p=pathlib.Path('/tmp/final/eval/generation_per_case.csv')
          st=pathlib.Path('/tmp/final/stats/paired_tests.csv')
          out={
            'status':'PASS_FULL_DEV_EVALUATED_REPAIRED',
            'test_accessed':False,
            'generation_per_case_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'paired_tests_sha256':hashlib.sha256(st.read_bytes()).hexdigest(),
            'conditions':{k:v for k,v in s.items() if not k.startswith('_')}
          }
          pathlib.Path('/tmp/final/FULL_DEV_RESULT_MANIFEST.json').write_text(json.dumps(out,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AICCONF-PHASE2-FULL-DEV-QWEN-v16-REPAIRED
          path: /tmp/final
          retention-days: 30
