name: AICCONF Phase2 Full DEV Qwen

on:
  push:
    branches: [aicconf-full-dev-20260914]
    paths: [.github/workflows/aicconf-phase2-full-dev-qwen.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify canonical v1.6 execution code
        working-directory: aicconf_runner/phase2
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/expected <<'EOF'
          7f0e569d4a0bda86d660a9ed6cd1ca7e75c25e7ccb84fa4ab427f901ebb7029e  common.py
          591a5b1af756d33b0904c1fc12ffb8dc487af978b24ce4696a0eb86cf4a6a523  build_target_corpus.py
          9116f4df79a46424059dfc0e29fc3e4018bfa6fa5623eebc8401b078ece6cca7  run_retrieval.py
          e9100112365ea210aab55841ebf71eee8b20a7bde4b08c90085f4ea5065c6710  make_attack_fixtures.py
          8e987a8d148c9f9adec9cd76984b2ad34350ab691e26f273d78e4f6885682aff  compose_prompt_cases.py
          00a9f33d691e502c7e4d77fb8f82cfa74af3370ea46049567e26c04b22a7dd44  ollama_preflight.py
          ceacef9975d57e301535fc1f7d992133101e08f9e5b694eaad0e4e59ae603dc4  run_ollama.py
          367b1cb539cfb58c5bbdd3f676b8b838ffc56732058b2d795621d9c48d6a6055  apply_output_guard.py
          2070d73f14b3f3d605a5d26e006ce8c62512af1c265e2a537b14cc2477485ce4  evaluate_generation.py
          6d0883aee4fc9502b853cdcd84e9c8024064ed7b3c6283273257baa96ac43d64  prepare_phase2.py
          40aab662c7c5b913abb20b545e5caec5996ff0e7c7677ec9058c7833438aa900  requirements.txt
          119cb4772e2b2ce6377a6b4833d88b0d3306b92bb6eddd7cceb42d127d2ef365  schemas/model_output.schema.json
          EOF
          sha256sum -c /tmp/expected
          python -m py_compile common.py build_target_corpus.py run_retrieval.py make_attack_fixtures.py compose_prompt_cases.py ollama_preflight.py run_ollama.py apply_output_guard.py evaluate_generation.py prepare_phase2.py
      - name: Install requirements
        working-directory: aicconf_runner/phase2
        run: python -m pip install -r requirements.txt
      - name: Recover and verify frozen Phase1
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p1a /tmp/p1
          gh run download 34834655690 --repo ErcanErkalkan/demo_ece --name AICCONF-PHASE1-FROZEN-HANDOFF --dir /tmp/p1a
          echo 'ce3686fc029787e66d3291f63d01fc536d17ad0936fa812ea5a81e1978247c06  /tmp/p1a/PHASE1_FROZEN_HANDOFF.zip' | sha256sum -c -
          unzip -q /tmp/p1a/PHASE1_FROZEN_HANDOFF.zip -d /tmp/p1
          python - <<'PY'
          import json,hashlib
          x=json.load(open('/tmp/p1/benchmark_frozen/PHASE1_RELEASE_FREEZE.json'))
          assert x['status']=='PASS_PHASE1_FROZEN'
          assert x['validation_report']['benchmark_rows']==195
          assert hashlib.sha256(open('/tmp/p1/benchmark_frozen/benchmark.csv','rb').read()).hexdigest()=='426d890e16513c3da449dfe08e93f29f556011e6a24288460c07ccba8f090f4f'
          print('PHASE1 VERIFIED')
          PY
      - name: Rebuild complete DEV preparation
        working-directory: aicconf_runner/phase2
        run: |
          python prepare_phase2.py --phase1-run /tmp/p1 --split dev --top-k 10 --context-k 5 --attack-rank 1 --outdir /tmp/dev
          python - <<'PY'
          import json,hashlib
          m=json.load(open('/tmp/dev/PHASE2_DEV_PREP_MANIFEST.json'))
          assert m['status']=='DEV_PREP_READY_NO_MODEL_RUN'
          assert m['benchmark_sha256']=='426d890e16513c3da449dfe08e93f29f556011e6a24288460c07ccba8f090f4f'
          assert m['corpus_sha256']=='02b12c20fe14e6a46e11249579559b44e674580cbdcc7a7424dbdd704ebb11e3'
          assert m['context_k']==5 and m['attack_rank']==1 and m['top_k']==10
          b=json.load(open(m['methods']['bm25']['metrics']))
          assert b['queries']==34
          print('BM25',json.dumps(b,sort_keys=True))
          PY
      - name: Deterministically shard all 408 BM25 DEV cases
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          src=pathlib.Path('/tmp/dev/prompt_cases_dev_bm25.jsonl')
          rows=[json.loads(x) for x in src.read_text().splitlines() if x.strip()]
          assert len(rows)==408, len(rows)
          ids=[r['case_id'] for r in rows]
          assert len(ids)==len(set(ids))==408
          d=pathlib.Path('/tmp/dev/shards'); d.mkdir()
          counts=[]
          for s in range(8):
              part=[r for i,r in enumerate(rows) if i%8==s]
              p=d/f'shard_{s}.jsonl'
              with p.open('w',encoding='utf-8') as f:
                  for r in part: f.write(json.dumps(r,ensure_ascii=False,sort_keys=True)+'\n')
              counts.append(len(part))
          pathlib.Path('/tmp/dev/full_dev_order.json').write_text(json.dumps(ids,indent=2),encoding='utf-8')
          print('SHARDS',counts,'TOTAL',sum(counts))
          assert counts==[51]*8
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-full-dev-prep
          path: /tmp/dev
          retention-days: 30

  infer:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with: {name: phase2-full-dev-prep, path: /tmp/dev}
      - name: Install requirements
        working-directory: aicconf_runner/phase2
        run: python -m pip install -r requirements.txt
      - name: Install and start Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 ollama serve >/tmp/ollama_${{ matrix.shard }}.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:11434/api/version && break || sleep 2; done
      - name: Freeze exact Qwen model and infer shard
        working-directory: aicconf_runner/phase2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shard
          ollama pull 'qwen2.5:1.5b'
          python ollama_preflight.py --model 'qwen2.5:1.5b' --out '/tmp/shard/model_${{ matrix.shard }}.json'
          python - <<'PY'
          import json
          p='/tmp/shard/model_${{ matrix.shard }}.json'
          x=json.load(open(p))
          assert x['status']=='PASS_OLLAMA_MODEL_FROZEN'
          assert x['model_digest']=='65ec06548149b04c096a120e4a6da9d4017ea809c91734ea5631e89f96ddc57b'
          assert x['ollama_version']=='0.34.0'
          PY
          python run_ollama.py --cases '/tmp/dev/shards/shard_${{ matrix.shard }}.jsonl' --model 'qwen2.5:1.5b' --model-freeze '/tmp/shard/model_${{ matrix.shard }}.json' --temperature 0 --seed 2027 --num-ctx 8192 --num-predict 512 --top-p 1 --top-k-sampling 40 --repeat-penalty 1.1 --timeout 180 --retries 2 --out '/tmp/shard/pred_${{ matrix.shard }}.jsonl'
          python - <<'PY'
          import json
          p='/tmp/shard/pred_${{ matrix.shard }}.jsonl.manifest.json'
          x=json.load(open(p))
          assert x['status']=='PASS_COMPLETE' and x['case_count']==51 and not x['failures']
          assert x['model_digest']=='65ec06548149b04c096a120e4a6da9d4017ea809c91734ea5631e89f96ddc57b'
          print('SHARD PASS', '${{ matrix.shard }}', x['predictions_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-full-dev-shard-${{ matrix.shard }}
          path: |
            /tmp/shard/
            /tmp/ollama_${{ matrix.shard }}.log
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: infer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with: {name: phase2-full-dev-prep, path: /tmp/dev}
      - uses: actions/download-artifact@v4
        with:
          pattern: phase2-full-dev-shard-*
          path: /tmp/shards
          merge-multiple: true
      - name: Install evaluator requirements
        working-directory: aicconf_runner/phase2
        run: python -m pip install -r requirements.txt
      - name: Merge and independently verify 408 predictions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/final
          python - <<'PY'
          import json,glob,pathlib,hashlib,statistics
          order=json.load(open('/tmp/dev/full_dev_order.json'))
          preds={}
          for p in sorted(glob.glob('/tmp/shards/pred_*.jsonl')):
              for line in open(p,encoding='utf-8'):
                  r=json.loads(line)
                  cid=r['case_id']
                  assert cid not in preds, cid
                  assert r['model']=='qwen2.5:1.5b'
                  assert r['model_digest']=='65ec06548149b04c096a120e4a6da9d4017ea809c91734ea5631e89f96ddc57b'
                  assert r['error']==''
                  preds[cid]=r
          assert len(order)==408 and len(preds)==408
          assert set(order)==set(preds)
          out=pathlib.Path('/tmp/final/pred_qwen2.5_1.5b.jsonl')
          with out.open('w',encoding='utf-8') as f:
              for cid in order: f.write(json.dumps(preds[cid],ensure_ascii=False,sort_keys=True)+'\n')
          b=out.read_bytes()
          lats=[preds[x]['latency_s'] for x in order]
          manifest={'status':'PASS_FULL_DEV_MERGED','case_count':408,'model':'qwen2.5:1.5b','model_digest':'65ec06548149b04c096a120e4a6da9d4017ea809c91734ea5631e89f96ddc57b','predictions_sha256':hashlib.sha256(b).hexdigest(),'latency_mean_s':sum(lats)/len(lats),'latency_median_s':statistics.median(lats),'shards':8,'test_accessed':False}
          pathlib.Path('/tmp/final/FULL_DEV_MERGE_MANIFEST.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          print(json.dumps(manifest,indent=2))
          PY
      - name: Apply hardened output guard and evaluate full DEV
        working-directory: aicconf_runner/phase2
        run: |
          python apply_output_guard.py --cases /tmp/dev/prompt_cases_dev_bm25.jsonl --predictions /tmp/final/pred_qwen2.5_1.5b.jsonl --out /tmp/final/pred_qwen2.5_1.5b_guarded.jsonl
          python evaluate_generation.py --cases /tmp/dev/prompt_cases_dev_bm25.jsonl --predictions /tmp/final/pred_qwen2.5_1.5b_guarded.jsonl --corpus /tmp/dev/corpus_primary/nist_corpus.csv --outdir /tmp/final/eval
          cp /tmp/dev/PHASE2_DEV_PREP_MANIFEST.json /tmp/final/
          cp /tmp/dev/retrieval_dev_bm25/bm25_metrics.json /tmp/final/
          cp /tmp/dev/full_dev_order.json /tmp/final/
          cp /tmp/shards/model_*.json /tmp/final/ || true
          python - <<'PY'
          import json
          s=json.load(open('/tmp/final/eval/generation_summary.json'))
          print(json.dumps({k:v for k,v in s.items() if not k.startswith('_')},indent=2,allow_nan=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AICCONF-PHASE2-FULL-DEV-QWEN-v16
          path: /tmp/final
          retention-days: 30
