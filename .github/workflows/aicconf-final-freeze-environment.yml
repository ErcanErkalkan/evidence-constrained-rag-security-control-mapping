name: AICCONF Final Freeze Environment

on:
  push:
    branches: [aicconf-final-lock-20260915]
    paths: [.github/workflows/aicconf-final-freeze-environment.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and unpack canonical Phase2 v1.6
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/aicconf_runner/AICCONF2027_Phase2_RAG_Scaffold_v1.6.zip"
          echo '8f6c474ae3e9968bd708c7cb9b8ab2df5cfe66d78db63bc8fad614578b9d183b  '"$ZIP" | sha256sum -c -
          mkdir -p /tmp/p2
          unzip -q "$ZIP" -d /tmp/p2
          cd /tmp/p2/aicconf_phase2_v16
          sha256sum -c SHA256SUMS.txt
          python -m py_compile common.py environment_preflight.py freeze_final_config.py run_final_test.py final_common.py verify_final_results.py
      - name: Install locked analysis requirements
        working-directory: /tmp/p2/aicconf_phase2_v16
        run: python -m pip install -r requirements.txt
      - name: Freeze environment
        working-directory: /tmp/p2/aicconf_phase2_v16
        run: python environment_preflight.py --out /tmp/ENVIRONMENT_FREEZE.json
      - uses: actions/upload-artifact@v4
        with:
          name: AICCONF-DEV-ENVIRONMENT-FREEZE
          path: /tmp/ENVIRONMENT_FREEZE.json
          retention-days: 30
